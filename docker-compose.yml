services:
  # ──────────────────────────── LDAP ────────────────────────────
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap
    environment:
      LDAP_ORGANISATION: "Example Inc"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=example,dc=com -D 'cn=admin,dc=example,dc=com' -w admin uid=user1 >/dev/null"]
      start_period: 30s
      interval:      5s
      timeout:       5s
      retries:       5

  # ─────────────── DB for LiteLLM ─────────────
  db-litellm:
    image: postgres:15
    container_name: db-litellm
    platform: linux/arm64
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB:       litellm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-litellm:/var/lib/postgresql/data
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U admin -d litellm_db"]
      start_period: 30s
      interval:     5s
      timeout:      5s
      retries:      5
    restart: on-failure

  # ─────────────── LiteLLM ─────────────
  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    container_name: litellm
    platform: linux/arm64
    ports:
      - "4000:4000"
    environment:
      LITELLM_ADMIN_USER:     admin
      LITELLM_ADMIN_PASSWORD: pass
      HOST:                   0.0.0.0
      PORT:                   4000
      DATABASE_URL:           postgresql://admin:pass@db-litellm:5432/litellm_db
      LITELLM_MASTER_KEY:     sk-1234
      LITELLM_SALT_KEY:       sk-litellm-salt-key
      STORE_MODEL_IN_DB:      "True"
    volumes:
      - ./litellm/config:/app/config
    depends_on:
      db-litellm:
        condition: service_healthy
    healthcheck:
      test:         ["CMD-SHELL", "curl -sf http://localhost:4000/health/readiness || exit 1"]
      start_period: 30s
      interval:     10s
      timeout:      10s
      retries:      10
    restart: on-failure

  # ─────────────── DB for Token Generator ─────────────
  db-token:
    image: postgres:15
    container_name: db-token
    platform: linux/arm64
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB:       token_db
    ports:
      - "6432:5432"
    volumes:
      - postgres-data-token:/var/lib/postgresql/data
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U admin -d token_db"]
      start_period: 30s
      interval:     5s
      timeout:      5s
      retries:      5
    restart: on-failure

  # ─────────────── FastAPI / Token Generator ───────────────
  token-generator:
    build: ./token-generator
    container_name: token-generator
    depends_on:
      ldap:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      LDAP_SERVER_HOST:    ldap
      LDAP_SERVER_PORT:    389
      LDAP_BIND_DN:        "cn=admin,dc=example,dc=com"
      LDAP_BIND_PASSWORD:  "admin"
      LDAP_SEARCH_BASE:    "ou=users,dc=example,dc=com"
      LITELLM_BASE_URL:    http://litellm:4000
      LITELLM_MASTER_KEY:  sk-1234
      DB_TOKEN_URL:        "postgresql://admin:pass@db-token:5432/token_db"
      APP_ENV:             "development"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >
          import urllib.request, sys;
          resp = urllib.request.urlopen("http://localhost:8000/health/ready");
          sys.exit(0 if resp.status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: on-failure


  # ─────────────── Frontend ───────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      token-generator:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000 || exit 1" ]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10

  # ────────────────────────── pgAdmin ──────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    platform: linux/arm64
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:      admin@example.com
      PGADMIN_DEFAULT_PASSWORD:   pass
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      db-litellm:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost')"]
      start_period: 30s
      interval:     10s
      timeout:      10s
      retries:      10
    restart: unless-stopped

  # ──────────────────── Integration tests ────────────────────
  test:
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: token-generator-test:latest
    depends_on:
      ldap:
        condition: service_healthy
      token-generator:
        condition: service_healthy
    working_dir: /code
    volumes:
      - ./:/code
    environment:
      LDAP_HOST:   ldap
      ADMIN_DN:    "cn=admin,dc=example,dc=com"
      ADMIN_PASS:  "admin"
    entrypoint: ["bash", "-c", "pytest --maxfail=1 --disable-warnings -q"]

volumes:
  postgres-data-litellm:
  postgres-data-token:
  pgadmin_data:
